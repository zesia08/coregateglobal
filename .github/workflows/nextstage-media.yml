name: Build original-media NEXT STAGE event gallery
on:
  push:
    paths:
      - '.github/workflows/nextstage-media.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify real event video frame assets
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            file "assets/media/nextstage-real-$n.jpg" | grep -q JPEG
          done
      - name: Produce short silent photo-motion recap from original video frames
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel warning -y \
            -loop 1 -framerate 24 -t 4 -i assets/media/nextstage-real-1.jpg \
            -loop 1 -framerate 24 -t 4 -i assets/media/nextstage-real-2.jpg \
            -loop 1 -framerate 24 -t 4 -i assets/media/nextstage-real-3.jpg \
            -filter_complex "[0:v]scale=1280:720,setsar=1,zoompan=z='min(zoom+0.0005,1.06)':d=1:s=1280x720:fps=24,format=yuv420p,fade=t=out:st=3.65:d=0.35[v0];[1:v]scale=1280:720,setsar=1,zoompan=z='min(zoom+0.0005,1.06)':d=1:s=1280x720:fps=24,format=yuv420p,fade=t=in:st=0:d=0.25,fade=t=out:st=3.65:d=0.35[v1];[2:v]scale=1280:720,setsar=1,zoompan=z='min(zoom+0.0005,1.06)':d=1:s=1280x720:fps=24,format=yuv420p,fade=t=in:st=0:d=0.25[v2];[v0][v1][v2]concat=n=3:v=1:a=0,format=yuv420p[out]" \
            -map "[out]" -c:v libx264 -preset veryfast -crf 25 -movflags +faststart -pix_fmt yuv420p \
            -an assets/media/nextstage-video-frame-recap.mp4
          test $(stat -c %s assets/media/nextstage-video-frame-recap.mp4) -gt 100000
          file assets/media/nextstage-video-frame-recap.mp4
      - name: Commit media recap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/nextstage-video-frame-recap.mp4
          git diff --cached --quiet || (git commit -m "Add NEXT STAGE on-site video frame recap" && git push)
